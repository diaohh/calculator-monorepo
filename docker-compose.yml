services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: calculator-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # APP_HOST is the address the browser uses to reach this machine. It defaults to
      # localhost; set it to the LAN IP (APP_HOST=192.168.1.20 docker compose up) to open the
      # app from a phone, which needs both this origin and the frontend's base URL to move
      # together.
      ALLOWED_ORIGIN: "http://${APP_HOST:-localhost}:5173"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: calculator-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://${APP_HOST:-localhost}:8080/api/v1"
      # Without this pnpm puts its store next to node_modules, inside the bind mount, where it
      # lands in the repository and gets polled by the file watcher
      PNPM_STORE_PATH: "/pnpm-store"
    volumes:
      - ./frontend:/app
      # Dedicated volume: container dependencies are not overwritten by the host ones
      - frontend-node-modules:/app/node_modules
      - pnpm-store:/pnpm-store
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  go-mod-cache:
  frontend-node-modules:
  pnpm-store:
