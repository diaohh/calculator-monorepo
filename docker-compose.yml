services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: calculator-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ALLOWED_ORIGIN: "http://localhost:5173"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: calculator-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    volumes:
      - ./frontend:/app
      # Dedicated volume: container dependencies are not overwritten by the host ones
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  go-mod-cache:
  frontend-node-modules:
